  <!-- Startup diagnostics: report missing assets without blocking the application. -->
  <script>
    window.addEventListener('load', function () {
      var root = document.getElementById('app-root');
      if (root) {
        root.setAttribute('aria-busy', 'false');
        var status = document.getElementById('app-startup-status');
        if (status && root.children.length > 1) status.hidden = true;
      }
      if (!document.querySelector('link[rel="stylesheet"][href="styles.css"]')) {
        console.warn('ExpertHub: styles.css link is missing.');
      }
    });
