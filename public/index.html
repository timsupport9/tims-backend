  <!--
    Socket.IO client.
    MUST load before /js/04-api.js runs initializeSocket().
    Do NOT add `defer` — server.js serves this synchronously and
    the split files below depend on `io` being defined globally.
  -->
  <script src="/socket.io/socket.io.js"></script>

  <!-- App styles -->
  <link rel="stylesheet" href="styles.css" />

  <!-- Avoid flash of unstyled theme: apply saved dark mode before paint -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark') document.documentElement.classList.add('dark');
      } catch (_) {}
    })();
  </script>

     MODELS LAYER — js/models/
     ------------------------------------------------------------
     The model layer provides the canonical frontend representation
     of ExpertHub business objects.

     API / Backend
          
     Normalization
          
     js/models/
          
     State / Store
          
     Dashboards / Features / Actions / Modals / Public Pages

     IMPORTANT:
     - Models normalize API data.
     - Models provide predictable object shapes.
     - Models should NOT directly manipulate the DOM.
     - Models should NOT open modals.
     - Models should NOT contain dashboard rendering logic.
     - Models should NOT contain authentication UI.
     - API communication belongs in js/api/ / 04-api.js.
     - Modal behaviour belongs in js/modals/.
     ============================================================ -->
