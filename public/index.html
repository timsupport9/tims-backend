  <!-- ============================================================
       THEME — avoid flash of unstyled dark mode before paint
       ============================================================ -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark') document.documentElement.classList.add('dark');
      } catch (_) {}
    })();
  </script>

       STRUCTURED DATA (JSON-LD) — helps rich results

<body>
  <!-- ============================================================
       ACCESSIBILITY — skip link + live region
       ============================================================ -->
  <a href="#app-root" class="skip-link">Skip to main content</a>

  <div id="sr-announcer"
       class="sr-only"
       role="status"
       aria-live="polite"
       aria-atomic="true"></div>

  <!-- ============================================================
       SPA MOUNT POINTS
       ============================================================ -->
  <div id="app-root"></div>
  <div id="toast-container" role="region" aria-label="Notifications"></div>
  <div id="modal-root"></div>

  <!-- ============================================================
       BOOT LOADER — removed on first render (or after 4s safety net)
       ============================================================ -->
  <div id="boot-loader" class="loading-overlay" aria-hidden="true">
    <div class="spinner" role="status" aria-label="Loading ExpertHub"></div>
  </div>

  <script>
    (function () {
      function removeLoader() {
        var el = document.getElementById('boot-loader');
        if (el && el.parentNode) el.parentNode.removeChild(el);
      }
      window.addEventListener('experthub:ready', removeLoader, { once: true });
      // Safety net: hide after 4s regardless of app boot state.
      setTimeout(removeLoader, 4000);
    })();
  </script>

  <!-- ============================================================
       GLOBAL IMAGE FALLBACK — replaces broken images with initials
       ============================================================ -->
  <script>
    document.addEventListener('error', function (e) {
      var el = e.target;
      if (!(el instanceof HTMLImageElement)) return;
      if (el.dataset.fallbackApplied) return;
      el.dataset.fallbackApplied = '1';
      el.src = 'https://ui-avatars.com/api/?name=' +
               encodeURIComponent(el.alt || 'ExpertHub') +
               '&background=6366f1&color=fff&size=256';
    }, true);
  </script>
